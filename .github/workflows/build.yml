# SPDX-License-Identifier: MIT

name: Build distributions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - manifest.json
      - windows/**
      - linux/**
      - .github/workflows/**
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 300
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Test packaging scripts
        run: .\windows\test.ps1

      - name: Install libusb with vcpkg
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libusb:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install MSYS2 packages for libsigrok
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --needed --noconfirm base-devel mingw-w64-ucrt-x86_64-{gcc,autotools,pkgconf,tools-git,ntldd}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build zip, msi and exe
        run: .\windows\build.ps1 -Target all -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT

      - name: Install and uninstall msi and exe
        run: .\windows\build.ps1 -Target install-test -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: out/*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-logs
          path: work/windows/logs
          retention-days: 7

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Test packaging script
        run: python3 linux/test_build.py

      - name: Install build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config curl autoconf automake libtool \
            libvulkan-dev libdbus-1-dev libwayland-dev libwayland-bin libxkbcommon-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libglib2.0-dev libzip-dev libusb-1.0-0-dev

      - name: Build AppImage
        run: python3 linux/build.py all

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: out/*
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-logs
          path: work/linux/logs
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-packages'
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
          (cd out && sha256sum * > SHA256SUMS.txt)
          python3 - "$version" > notes.md <<'EOF'
          import json, sys
          manifest = json.load(open("manifest.json"))
          print(f"Bitoscope {sys.argv[1]}: application, all decoders, demo driver, FNIRSI DLA-16 driver and sigrok bridge.")
          print()
          print("Built from:")
          print()
          for repo in manifest["repos"]:
              print(f"- {repo['name']} {repo['tag']} ({repo['commit']})")
          EOF
          gh release create "$GITHUB_REF_NAME" out/* --title "Bitoscope $version" --notes-file notes.md --verify-tag
