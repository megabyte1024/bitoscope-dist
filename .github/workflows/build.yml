# SPDX-License-Identifier: MIT

name: Build distributions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - manifest.json
      - windows/**
      - linux/**
      - .github/workflows/**
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  packages:
    uses: ./.github/workflows/packages.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: '*-packages'
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
          (cd out && sha256sum * > SHA256SUMS.txt)
          python3 - "$version" > notes.md <<'EOF'
          import json, sys
          manifest = json.load(open("manifest.json"))
          print(f"Bitoscope {sys.argv[1]}: application, all decoders, demo driver, FNIRSI DLA-16 driver and sigrok bridge.")
          print()
          print("Built from:")
          print()
          for repo in manifest["repos"]:
              print(f"- {repo['name']} {repo.get('tag') or repo['branch']} ({repo['commit']})")
          EOF
          gh release create "$GITHUB_REF_NAME" out/* --title "Bitoscope $version" --notes-file notes.md --verify-tag
