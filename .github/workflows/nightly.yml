# SPDX-License-Identifier: MIT

name: Nightly build

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly

jobs:
  sources:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - name: Find newest commits of public repositories
        run: python3 linux/build.py nightly-manifest --nightly-manifest-out nightly-manifest.json

      - name: Compare with last nightly
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh release download nightly --pattern nightly-manifest.json --output previous.json 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          def commits(path):
              return sorted((repo["name"], repo["commit"]) for repo in json.load(open(path))["repos"])
          print("changed=" + ("false" if commits("previous.json") == commits("nightly-manifest.json") else "true"))
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-manifest
          path: nightly-manifest.json
          retention-days: 7

  packages:
    needs: sources
    if: needs.sources.outputs.changed == 'true'
    uses: ./.github/workflows/packages.yml
    with:
      nightly: true

  publish:
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: '*-packages'
          path: out
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: nightly-manifest
          path: out

      - name: Publish nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd out && sha256sum * > SHA256SUMS.txt)
          python3 - > notes.md <<'EOF'
          import json
          from datetime import datetime, timezone
          manifest = json.load(open("out/nightly-manifest.json"))
          print(f"Bitoscope Nightly {manifest['version']}, built {datetime.now(timezone.utc):%Y-%m-%d %H:%M} UTC from newest commits:")
          print()
          for repo in manifest["repos"]:
              print(f"- {repo['name']} {repo['branch']} ({repo['commit']})")
          print()
          print("Installs as separate program Bitoscope Nightly, beside release.")
          EOF
          if gh release view nightly > /dev/null 2>&1; then
            gh release upload nightly out/* --clobber
            gh release edit nightly --prerelease --title "Bitoscope Nightly" --notes-file notes.md
          else
            gh release create nightly out/* --prerelease --title "Bitoscope Nightly" --notes-file notes.md --target "$GITHUB_SHA"
          fi
